[flake8]
ignore =
    D400, D205
extend-select = D101,D102, I
per-file-ignores =
    tests/*:D101,D102
max-line-length = 120
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    horilla-crm

[isort]
skip = horilla-crm
profile = black
known_first_party = factory,pages,utils,config
line_length = 120