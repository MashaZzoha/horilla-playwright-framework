[pytest]
testpaths=tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_* *_test
addopts = -v --strict-markers --tb=short
markers =
    smoke
    regress
    ui
    api
    drogaytseva
    dashboard
    home_page_test
    login_page_test
    navigation_menu_test
    sales_page_test

