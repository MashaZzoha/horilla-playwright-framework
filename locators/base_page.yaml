Алерт Успешная авторизация:
  role: alert
  name: Login successful
  exact: false
Активная кнопка меню:
  role: link
  name: '{link_name}'
  css: a[class*='hover']
# link_name - название ссылки на плашке (Home, Sales, People, Analytics, Schedule, My Jobs)
Неактивная кнопка меню:
  role: link
  name: '{link_name}'
  css: a:not([class*='hover'])
# link_name - название ссылки на плашке (Home, Sales, People, Analytics, Schedule, My Jobs)
Кнопка Add New:
  role: button
  name: Add New
Кнопка New:
  role: button
  name: New
Селектор select2:
  css: select[name*='{selector_name}'] + span.select2-container span.selection
# selector_name - название селектора2 (частичное значение атрибута name: industry/country)
Опция select2:
  css: ul[id*='{selector_name}'] li[role='option']
  filter_text: "{option}"
# selector_name - частичное id для опции селектора, указывающее на его принадлежность (industry/country)
# option - опция в выпадающем списке селектора
Кнопка Одностраничная форма:
  role: link
  name: Single-Step Form
Кнопка Многостраничная форма:
  role: link
  name: Multi-Step Form
Прогресс-бар:
  css: ul.progress
Активная стадия прогресса:
  xpath: //li[@class='active'][.//p[text()='{active_stage}']]
# active_stage - активная стадия прогресса заполнения многостраничной формы
# доступные стадии Create Lead: Basic Information/Company Details/Location/Requirements
# доступные стадии Create Account: Account Information/Address Information/Additional Information/Description
Кнопка Next:
  role: button
  name: Next
Кнопка Previous:
  role: button
  name: Previous
