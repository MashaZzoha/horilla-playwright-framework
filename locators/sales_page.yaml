Заголовок Leads:
  role: heading
  name: Leads
Меню Leads:
  role: link
  name: Leads
Форма Create Lead:
  css: form#lead-form-view
Одностраничная форма lead:
  css: div#lead-form-view-container
Многостраничная форма lead:
  css: div#lead-form-view-multi-container
Поле First Name:
  placeholder: Enter First Name
Поле Last Name:
  placeholder: Enter Last Name
Поле Email:
  placeholder: Enter Email
Поле Number of Employees:
  role: spinbutton
  name: Number of Employees
Поле City:
  role: textbox
  name: City
Поле Zip:
  role: textbox
  name: Zip
Поле Lead Company:
  placeholder: Enter Lead Company
Поле Requirements:
  role: textbox
  name: Requirements
Кнопка Add Lead Stage:
  role: button
  name: '+ Add'
Окно Create Lead Stage:
  css: div#dynamicCreateModalBox
Поле Status Name:
  placeholder: Enter Status Name
Поле Status Order:
  placeholder: Enter Status Order
Поле Status Color:
  role: textbox
  name: Status Color
Поле Probability:
  placeholder: Enter Probability
Кнопка Save Lead Stage:
  css: div#dynamicCreateModalBox form button
  filter_text: Save
Алерт Успех Lead created:
  role: alert
  name: Lead created successfully
  exact: false
Алерт Успех Lead was created:
  role: alert
  name: Lead was successfully created
  exact: false



